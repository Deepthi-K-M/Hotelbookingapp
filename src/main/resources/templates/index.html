<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Hotel Luxury Stay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .hotel-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; cursor: pointer; }
        .hotel-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); }
        .price-tag { font-size: 1.25rem; font-weight: bold; color: #0d6efd; }
        .card-img-top { height: 220px; object-fit: cover; background-color: #e9ecef; }
        .star-filled { color: #ffc107; }
    </style>
</head>
<body class="container py-5">

<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="fw-bold text-dark">Find Your Perfect Stay</h1>
        <p class="text-muted mb-0" sec:authorize="isAuthenticated()">
            Welcome back, <span class="fw-bold text-primary" th:text="${#authentication.name}">Guest</span>!
        </p>
    </div>
    <div class="d-flex gap-2">
        <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary px-4">Login</a>
        <a sec:authorize="isAuthenticated()" href="/my-bookings" class="btn btn-primary px-4">My Bookings</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-danger px-4">Logout</button>
        </form>
    </div>
</div>

<!-- Search bar -->
<form th:action="@{/rooms}" method="get" class="mb-4">
    <div class="input-group" style="max-width: 400px;">
        <input type="text" name="keyword" class="form-control"
               placeholder="Search hotels..." th:value="${keyword}">
        <button class="btn btn-outline-primary" type="submit">
            <i class="bi bi-search"></i>
        </button>
        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
           href="/rooms" class="btn btn-outline-secondary">Clear</a>
    </div>
</form>

<!-- Hotel cards -->
<div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" th:each="room : ${rooms}">
        <!-- Entire card is now a link to the room detail page -->
        <a th:href="@{/rooms/{id}(id=${room.id})}" class="text-decoration-none text-dark">
            <div class="card hotel-card shadow-sm">
                <img th:src="${room.id != null} ?
                        'https://loremflickr.com/500/300/hotel?lock=' + ${room.id} :
                        'https://via.placeholder.com/500x300'"
                     class="card-img-top" alt="Hotel Image">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold text-truncate"
                        th:text="${room.name}" th:title="${room.name}">Hotel Name</h5>

                    <div class="mb-2">
                        <span th:class="${room.getAvailableRooms() > 0} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${room.getAvailableRooms() > 0} ? 'Available' : 'Fully Booked'"></span>
                    </div>

                    <p class="text-muted small mb-2">
                        <i class="bi bi-door-open me-1"></i>
                        <span th:text="${room.getAvailableRooms() + ' rooms remaining'}"></span>
                    </p>

                    <!-- Star rating if available -->
                    <p class="small mb-2" th:if="${room.getAverageRating() > 0}">
                        <i class="bi bi-star-fill star-filled me-1"></i>
                        <span th:text="${room.getAverageRating()} + ' / 5'"></span>
                    </p>

                    <p class="price-tag mb-3 mt-auto">
                        $<span th:text="${room.price}">0.00</span>
                        <span class="text-muted small fw-normal">/ night</span>
                    </p>

                    <div class="btn btn-primary w-100 fw-bold py-2">
                        <i class="bi bi-eye me-2"></i>View Details & Book
                    </div>
                </div>
            </div>
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
