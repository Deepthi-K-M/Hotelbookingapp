<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up - Luxury Stay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(rgba(10,25,47,0.7), rgba(10,25,47,0.7)),
                        url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
            height: 100vh; display: flex; align-items: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
            border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .btn-primary { background-color: #0d47a1; border: none; padding: 12px;
                       border-radius: 10px; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { background-color: #0a3d8d; transform: translateY(-2px);
                             box-shadow: 0 5px 15px rgba(13,71,161,0.4); }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
        .brand-logo { font-size: 2rem; font-weight: 800; color: #0d47a1; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card p-4 p-md-5">
                <div class="text-center">
                    <div class="brand-logo">
                        <i class="bi bi-person-badge-fill"></i> Luxury Stay
                    </div>
                    <h4 class="text-dark mb-4">Join Our Club</h4>
                </div>

                <div th:if="${param.error}" class="alert alert-danger small">
                    Username already exists. Please choose another.
                </div>

                <form th:action="@{/signup}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">CHOOSE USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-primary">
                                <i class="bi bi-person-plus"></i>
                            </span>
                            <input type="text" name="username"
                                   class="form-control bg-light border-start-0"
                                   placeholder="Enter username" required>
                        </div>
                    </div>

                    <!-- NEW: Email field for booking confirmation emails -->
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">
                            EMAIL ADDRESS <span class="text-muted fw-normal">(for booking confirmations)</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-primary">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" name="email"
                                   class="form-control bg-light border-start-0"
                                   placeholder="Enter email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">SET PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-primary">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" name="password"
                                   class="form-control bg-light border-start-0"
                                   placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        Create Account
                    </button>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0">
                        Already a member?
                        <a href="/login" class="text-decoration-none fw-bold" style="color: #0d47a1;">
                            Login here
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
