<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Reservations - Luxury Stay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .booking-card { border: none; border-radius: 15px; background: white; transition: 0.3s; }
        .past-card { opacity: 0.85; background-color: #f1f3f5 !important; filter: grayscale(20%); }
        .section-title { border-bottom: 2px solid #dee2e6; padding-bottom: 10px; margin-bottom: 25px; font-weight: 700; }
        .btn-rebook { background-color: #0d47a1; color: white; border: none; }
        .cost-badge { background: #eff6ff; color: #1d4ed8; border-radius: 8px; padding: 4px 10px; font-weight: 600; font-size: 0.9rem; }
        .date-row { font-size: 0.88rem; color: #64748b; }
    </style>
</head>
<body class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold"><i class="bi bi-journal-check me-2"></i>My Reservations</h2>
    <a href="/rooms" class="btn btn-outline-primary btn-sm">Back to Hotels</a>
</div>

<div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Upcoming stays -->
<div class="mb-5">
    <h4 class="section-title text-primary">Upcoming Stays</h4>

    <div th:if="${#lists.isEmpty(upcoming)}" class="text-muted fst-italic">No upcoming bookings.</div>

    <div th:each="booking : ${upcoming}"
         class="card booking-card p-4 mb-3 shadow-sm border-start border-primary border-4">
        <div class="row align-items-center">
            <div class="col-md-7">
                <h5 class="fw-bold text-dark mb-1" th:text="${booking.room.name}"></h5>
                <div class="date-row mb-1">
                    <i class="bi bi-calendar-event me-1"></i>
                    Check-in: <strong th:text="${booking.checkInDate}"></strong>
                    &nbsp;&rarr;&nbsp;
                    Check-out: <strong th:text="${booking.checkOutDate != null ? booking.checkOutDate : 'N/A'}"></strong>
                </div>
                <!-- Total cost -->
                <span class="cost-badge">
                    Total: $<span th:text="${#numbers.formatDecimal(booking.totalCost, 1, 2)}"></span>
                </span>
            </div>
            <div class="col-md-5 text-end">
                <form th:action="@{/cancel-booking/{id}(id=${booking.id})}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Past stays -->
<div>
    <h4 class="section-title text-muted">Past Stays</h4>

    <div th:if="${#lists.isEmpty(past)}" class="text-muted fst-italic">No past bookings.</div>

    <div th:each="booking : ${past}"
         class="card booking-card past-card p-4 mb-3 shadow-sm">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h5 class="fw-bold text-dark mb-1" th:text="${booking.room.name}"></h5>
                <div class="date-row mb-1">
                    <i class="bi bi-calendar-check me-1"></i>
                    Stayed: <strong th:text="${booking.checkInDate}"></strong>
                    &nbsp;&rarr;&nbsp;
                    <strong th:text="${booking.checkOutDate != null ? booking.checkOutDate : 'N/A'}"></strong>
                </div>
                <span class="cost-badge">
                    Total Paid: $<span th:text="${#numbers.formatDecimal(booking.totalCost, 1, 2)}"></span>
                </span>
            </div>
            <div class="col-md-6 text-end d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="${'#reviewModal' + booking.id}">
                    <i class="bi bi-star-fill me-1"></i>Review
                </button>
                <a th:href="@{/download-receipt/{id}(id=${booking.id})}"
                   class="btn btn-outline-dark btn-sm">
                    <i class="bi bi-download me-1"></i>Receipt
                </a>
                <a th:href="@{/rooms(keyword=${booking.room.name})}"
                   class="btn btn-rebook btn-sm">Rebook</a>
            </div>
        </div>
    </div>
</div>

<!-- Review modals -->
<div th:each="booking : ${past}" class="modal fade"
     th:id="${'reviewModal' + booking.id}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/leave-review/{roomId}(roomId=${booking.room.id})}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Rate Stay at <span th:text="${booking.room.name}"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-start">
                    <div class="mb-3">
                        <label class="form-label">Star Rating</label>
                        <select name="rating" class="form-select" required>
                            <option value="5">5 Stars - Amazing</option>
                            <option value="4">4 Stars - Great</option>
                            <option value="3">3 Stars - Good</option>
                            <option value="2">2 Stars - Fair</option>
                            <option value="1">1 Star - Poor</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Your Experience</label>
                        <textarea name="comment" class="form-control" rows="3"
                                  placeholder="Write a comment..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Submit Review</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
