apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotelbooking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotelbooking
  template:
    metadata:
      labels:
        app: hotelbooking
    spec:
      containers:
        - name: hotelbooking
          image: hotelbooking:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: SPRING_MAIL_USERNAME
              value: sundori.57ch.64ig@gmail.com
            - name: SPRING_MAIL_PASSWORD
              value: sgugawsngdqhyvmv
---
apiVersion: v1
kind: Service
metadata:
  name: hotelbooking
spec:
  type: NodePort
  selector:
    app: hotelbooking
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090